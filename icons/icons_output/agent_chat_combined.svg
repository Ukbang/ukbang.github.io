<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <style>
      .s  { fill:none; stroke:rgb(79,70,229); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
      .st { fill:none; stroke:rgb(79,70,229); stroke-width:1.3; stroke-linecap:round; stroke-linejoin:round; }
      .dot { fill:rgb(79,70,229); }
    </style>
    <!-- 로봇 상단 2/3만 보이도록 클립 (SVG 절대좌표 기준) -->
    <clipPath id="robot-clip" clipPathUnits="userSpaceOnUse">
      <rect x="0" y="0" width="68" height="80"/>
    </clipPath>
  </defs>

  <!-- 로봇 (아래쪽 배치, 상단 2/3만 표시) -->
  <g transform="translate(2, 32) scale(0.82)" clip-path="url(#robot-clip)">
    <!-- 안테나 -->
    <line x1="40" y1="20" x2="40" y2="13" class="s"/>
    <circle cx="40" cy="11" r="2.5" class="s"/>
    <!-- 머리 -->
    <rect x="18" y="20" width="44" height="34" rx="5" class="s"/>
    <!-- 눈 -->
    <circle cx="30" cy="36" r="4" class="s"/>
    <circle cx="50" cy="36" r="4" class="s"/>
    <circle cx="30" cy="36" r="1.5" class="dot"/>
    <circle cx="50" cy="36" r="1.5" class="dot"/>
    <!-- 입 -->
    <line x1="31" y1="46" x2="49" y2="46" class="s"/>
    <!-- 목 -->
    <line x1="35" y1="54" x2="35" y2="58" class="s"/>
    <line x1="45" y1="54" x2="45" y2="58" class="s"/>
    <!-- 몸통 (클립으로 잘림) -->
    <rect x="22" y="58" width="36" height="26" rx="4" class="s"/>
    <line x1="32" y1="63" x2="32" y2="79" class="st"/>
    <line x1="40" y1="63" x2="40" y2="79" class="st"/>
    <line x1="48" y1="63" x2="48" y2="79" class="st"/>
  </g>

  <!-- 말풍선 (오른쪽, 조금 작게, 꼬리 왼쪽 아래) -->
  <g transform="translate(52, 12)">
    <!-- 본체 -->
    <path d="M5 2 H36 Q41 2 41 8 V24 Q41 30 36 30 H5 Q0 30 0 24 V8 Q0 2 5 2 Z" class="s"/>
    <!-- 꼬리 (왼쪽 아래 → 로봇 입 방향, 본체에서 살짝 띄움) -->
    <path d="M5 30 L1 40 L13 30" class="s"/>
    <!-- 텍스트 줄 -->
    <line x1="7" y1="10" x2="34" y2="10" class="st"/>
    <line x1="7" y1="18" x2="34" y2="18" class="st"/>
    <line x1="7" y1="26" x2="22" y2="26" class="st"/>
  </g>
</svg>
